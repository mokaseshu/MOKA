<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Coastal Builders Card</title>
<meta property="og:title" content="Ravi Kumar · Coastal Builders">
<meta property="og:description" content="Residential & commercial construction in Andhra Pradesh. Tap to call, WhatsApp or save contact.">
<meta property="og:image" content="">
<meta name="theme-color" content="#0f4c5c">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html{background:#f2f5f7}

:root{--bg:#f2f5f7;--card:#fff;--ink:#0f2230;--muted:#5d6e7a;--brand:#0f4c5c;--accent:#e36414;--line:#e1e8ed}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:440px;margin:0 auto;padding:0 0 32px}
.hero{background:linear-gradient(150deg,var(--brand),#082a33);color:#fff;padding:36px 22px 70px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border:28px solid rgba(227,100,20,.35);border-radius:50%}
.logo{width:64px;height:64px;border-radius:18px;background:var(--accent);display:grid;place-items:center;font-family:Sora,sans-serif;font-weight:800;font-size:24px;color:#fff;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.hero h1{font-family:Sora,sans-serif;font-size:28px;font-weight:800;margin-top:18px;line-height:1.1}
.hero .role{opacity:.85;margin-top:6px;font-size:15px}
.hero .co{display:inline-block;margin-top:12px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:99px}
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:-42px 16px 0;position:relative;z-index:2}
.actions a{background:var(--card);border-radius:16px;padding:12px 4px 10px;text-align:center;text-decoration:none;color:var(--ink);font-size:11px;font-weight:600;box-shadow:0 6px 18px rgba(15,34,48,.10);display:flex;flex-direction:column;align-items:center;gap:6px;min-height:72px;justify-content:center}
.actions svg{width:22px;height:22px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btns{display:grid;grid-template-columns:1fr auto;gap:10px;margin:16px}
.btns button{border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.save{background:var(--accent);color:#fff}
.share{background:var(--card);color:var(--brand);border:1px solid var(--line)!important;padding:15px 18px!important}
.block{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:12px 16px;padding:18px}
.block h3{font-family:Sora,sans-serif;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.about{font-size:15px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:#eaf2f4;color:var(--brand);font-size:13px;font-weight:600;padding:7px 12px;border-radius:99px}
.line{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;text-decoration:none;color:var(--ink)}
h3+.line{border-top:0;padding-top:0}
.line svg{width:18px;height:18px;flex:none;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.line small{display:block;color:var(--muted);font-size:12px}
.social{display:flex;gap:10px}
.social a{flex:1;text-align:center;padding:11px;border-radius:12px;background:#eaf2f4;color:var(--brand);font-weight:600;font-size:13px;text-decoration:none}
.upi{display:flex;gap:14px;align-items:center}
.upi img{width:96px;height:96px;border-radius:10px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.3s}
.toast.on{opacity:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 16px 0}.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center}.stats b{display:block;font-family:Sora,sans-serif;font-size:22px;color:var(--brand)}.stats span{font-size:11.5px;color:var(--muted)}
.projects{display:grid;grid-template-columns:1fr 1fr;gap:10px}.proj{border-radius:14px;overflow:hidden;background:#eaf2f4}.proj svg{display:block;width:100%;height:auto}.proj p{font-size:12.5px;font-weight:600;padding:8px 10px 2px}.proj small{display:block;font-size:11px;color:var(--muted);padding:0 10px 10px}
.quote{display:block;margin:12px 16px;background:var(--ink);color:#fff;text-decoration:none;border-radius:18px;padding:18px;position:relative;overflow:hidden}.quote b{font-family:Sora,sans-serif;font-size:17px;display:block}.quote span{font-size:13px;opacity:.8;display:block;margin-top:4px}.quote i{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-style:normal;background:var(--accent);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
</style>


<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
const CARD={first:"Ravi",last:"Kumar",role:"Founder & Civil Engineer",company:"Coastal Builders",logo:"",initials:"CB",phone:"+916301521358",whatsapp:"916301521358",email:"hello@coastalbuilders.in",website:"https://coastalbuilders.in",address:"Beach Road, Ongole, Andhra Pradesh",maps:"https://maps.google.com/?q=Ongole",hours:"Mon – Sat · 9 am – 7 pm",about:"We build homes, villas and commercial spaces across coastal Andhra — on time, on budget, with transparent weekly updates.",services:["House construction","Villas","Commercial buildings","Renovation","Interiors","Plan approvals"],social:{Instagram:"https://instagram.com/",Facebook:"https://facebook.com/",YouTube:""},upi:"",waText:"Hi Ravi, I got your visiting card. I'd like to discuss a project."};
const PROJECTS=[{n:"Sai Residency",l:"G+3 apartments · Ongole",c:"#0f4c5c",f:4},{n:"Lakshmi Villa",l:"Duplex villa · Chirala",c:"#e36414",f:2},{n:"Harbour Plaza",l:"Commercial · Kakinada",c:"#3d5a6c",f:5},{n:"Green Nest",l:"Independent house · Nellore",c:"#5a7d4f",f:1}];
const bld=(c,f)=>{const h=18+f*14,y=110-h;let w="";for(let r=0;r<f;r++)for(let k=0;k<3;k++)w+=`<rect x="${58+k*16}" y="${y+10+r*14}" width="9" height="8" rx="1.5" fill="#fff" opacity=".85"/>`;return`<svg viewBox="0 0 180 120"><rect width="180" height="120" fill="#dfeaee"/><circle cx="150" cy="28" r="12" fill="#f6c27a"/><rect x="0" y="108" width="180" height="12" fill="#c9d8de"/><rect x="50" y="${y}" width="56" height="${h}" rx="3" fill="${c}"/>${w}<rect x="112" y="${110-h*.6}" width="26" height="${h*.6}" rx="2" fill="${c}" opacity=".55"/><rect x="72" y="96" width="12" height="14" fill="#fff" opacity=".9"/></svg>`};
const I={call:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',wa:'<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/>',mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/>',map:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',web:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const full=`${CARD.first} ${CARD.last}`;
const wa=`https://wa.me/${CARD.whatsapp}?text=${encodeURIComponent(CARD.waText)}`;
const esc=s=>String(s).replace(/[,;\\]/g,m=>"\\"+m);
function buildVcf(){return["BEGIN:VCARD","VERSION:3.0",`N:${esc(CARD.last)};${esc(CARD.first)};;;`,`FN:${esc(full)}`,`ORG:${esc(CARD.company)}`,`TITLE:${esc(CARD.role)}`,`TEL;TYPE=CELL,VOICE:${CARD.phone}`,`EMAIL;TYPE=WORK:${CARD.email}`,`URL:${CARD.website}`,`URL:${location.href.split("?")[0]}`,`ADR;TYPE=WORK:;;${esc(CARD.address)};;;;`,`NOTE:${esc(CARD.services.join(", "))}`,"END:VCARD"].join("\r\n")}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}
const social=Object.entries(CARD.social).filter(([,u])=>u);
document.getElementById("app").innerHTML=`
<div class="hero"><div class="logo">${CARD.logo?`<img src="${CARD.logo}" alt="">`:CARD.initials}</div><h1>${full}</h1><div class="role">${CARD.role}</div><span class="co">${CARD.company}</span></div>
<div class="actions"><a href="tel:${CARD.phone}">${ic("call")}Call</a><a href="${wa}">${ic("wa")}WhatsApp</a><a href="mailto:${CARD.email}">${ic("mail")}Email</a><a href="${CARD.maps}">${ic("map")}Directions</a><a href="${CARD.website}">${ic("web")}Website</a></div>
<div class="btns"><button class="save" id="save">Copy Contact</button><button class="share" id="share">Share</button></div>
<div class="stats"><div><b>15+</b><span>Years building</span></div><div><b>120+</b><span>Homes delivered</span></div><div><b>4.9★</b><span>Client rating</span></div></div>
<div class="block"><h3>About</h3><p class="about">${CARD.about}</p></div>
<div class="block"><h3>Services</h3><div class="chips">${CARD.services.map(s=>`<span>${s}</span>`).join("")}</div></div>
<div class="block"><h3>Recent projects</h3><div class="projects">${PROJECTS.map(pr=>`<div class="proj">${bld(pr.c,pr.f)}<p>${pr.n}</p><small>${pr.l}</small></div>`).join("")}</div></div>
<a class="quote" href="${wa}"><b>Get a free site visit</b><span>Share your plot size & budget on WhatsApp</span><i>→</i></a>
<div class="block"><h3>Contact</h3>
<a class="line" href="tel:${CARD.phone}">${ic("call")}<span>${CARD.phone.replace(/^\+91/,"+91 ")}<small>Mobile</small></span></a>
<a class="line" href="mailto:${CARD.email}">${ic("mail")}<span>${CARD.email}<small>Email</small></span></a>
<a class="line" href="${CARD.maps}">${ic("map")}<span>${CARD.address}<small>Office</small></span></a>
<div class="line">${ic("clock")}<span>${CARD.hours}<small>Working hours</small></span></div></div>
${social.length?`<div class="block"><h3>Follow</h3><div class="social">${social.map(([n,u])=>`<a href="${u}">${n}</a>`).join("")}</div></div>`:""}
${CARD.upi?`<div class="block"><h3>Pay</h3><div class="upi"><img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(`upi://pay?pa=${CARD.upi}&pn=${CARD.company}`)}" alt=""><div><b>UPI</b><br>${CARD.upi}</div></div></div>`:""}
<p class="foot">© ${new Date().getFullYear()} ${CARD.company}</p>`;
document.getElementById("save").onclick=async()=>{const t=`${full}\n${CARD.role}, ${CARD.company}\n${CARD.phone}\n${CARD.email}\n${CARD.website}`;try{await navigator.clipboard.writeText(t);toast("Contact details copied")}catch(e){toast(CARD.phone)}};
document.getElementById("share").onclick=async()=>{const data={title:`${full} · ${CARD.company}`,text:CARD.role,url:location.href};if(navigator.share){try{await navigator.share(data)}catch(e){}}else{try{await navigator.clipboard.writeText(location.href);toast("Link copied")}catch(e){toast(location.href)}}};
</script>
</body></html>
