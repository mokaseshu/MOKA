<style>
@page{size:95mm 57mm;margin:0}
:root{--brand:#0f4c5c;--accent:#e36414;--ink:#0f2230;--muted:#5d6e7a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.side{width:95mm;height:57mm;position:relative;overflow:hidden;page-break-after:always}
.safe{position:absolute;inset:7mm}
.crop{position:absolute;width:3mm;height:3mm;border-color:#000;border-style:solid;border-width:0}
.crop.tl{left:0;top:0;border-right-width:.15mm;border-bottom-width:.15mm}
.crop.tr{right:0;top:0;border-left-width:.15mm;border-bottom-width:.15mm}
.crop.bl{left:0;bottom:0;border-right-width:.15mm;border-top-width:.15mm}
.crop.br{right:0;bottom:0;border-left-width:.15mm;border-top-width:.15mm}
.front{background:#fff}
.front .bar{position:absolute;left:0;top:0;bottom:0;width:22mm;background:var(--brand)}
.front .bar::after{content:"";position:absolute;right:-5mm;top:15mm;width:10mm;height:10mm;background:var(--accent);border-radius:50%}
.front .safe{left:30mm;display:flex;flex-direction:column;justify-content:space-between}
.front .logo{position:absolute;left:6mm;top:7mm;width:12mm;height:12mm;border-radius:3mm;background:#fff;color:var(--brand);font-family:Sora,sans-serif;font-weight:800;font-size:9pt;display:grid;place-items:center;overflow:hidden}
.front .logo img{width:100%;height:100%;object-fit:contain}
.name{font-family:Sora,sans-serif;font-weight:800;font-size:12.5pt;color:var(--ink);line-height:1.05}
.role{font-size:7.2pt;color:var(--accent);font-weight:600;margin-top:1mm;letter-spacing:.04em;text-transform:uppercase}
.co{font-size:7.2pt;color:var(--muted);margin-top:.6mm}
.contacts{font-size:7pt;line-height:1.75;color:var(--ink)}
.contacts span{display:flex;align-items:center;gap:1.6mm}
.contacts i{width:1.4mm;height:1.4mm;border-radius:50%;background:var(--accent);flex:none}
.back{background:var(--brand);color:#fff}
.back .safe{display:flex;align-items:center;justify-content:space-between;gap:5mm}
.back .co2{font-family:Sora,sans-serif;font-weight:800;font-size:13pt;line-height:1.05}
.back p{font-size:7pt;opacity:.85;margin-top:2mm;line-height:1.5}
.back .web{display:inline-block;margin-top:3mm;font-size:7pt;font-weight:600;background:var(--accent);padding:1mm 2.4mm;border-radius:99px}
.qr{background:#fff;border-radius:2mm;padding:1.6mm;flex:none;text-align:center}
.qr img,.qr svg{width:22mm;height:22mm;display:block}
.qr span{display:block;color:var(--ink);font-size:5.5pt;font-weight:600;margin-top:.8mm}
</style>
<style>
@media screen{
html,body{width:auto!important;height:auto!important}

.viewer{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.viewer-head{max-width:900px;margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between;font-family:Inter,system-ui,sans-serif}
.viewer-head b{font-size:15px}
.viewer-head span{font-size:12.5px;color:#6b6358}
.stage-outer{max-width:900px;margin:0 auto;overflow:hidden}
.stage{position:relative;transform-origin:0 0;width:95mm;}
.side{box-shadow:0 6px 18px rgba(20,30,40,.22);border-radius:1mm}.side+.side{margin-top:6mm}body{--viewer-bg:#dfe5e8}
}
</style>
