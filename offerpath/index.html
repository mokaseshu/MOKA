<style>
/* Layout: sticky top bar + one content column; directory views use a filter rail beside a card grid that collapses to one column on phones */
:root{
  --bg:#F5F7F6;--surface:#FFFFFF;--surface-2:#EAF0EE;--line:#D5DFDB;
  --ink:#10201C;--ink-2:#4A5C57;--ink-3:#77887F;

  --marigold:#E89A16;--marigold-soft:#FCEFD6;--marigold-ink:#5A3A00;
  --good:#1F8A4C;--good-soft:#DDF3E5;--warn:#9A6200;--warn-soft:#FFF1D1;--bad:#B3261E;--bad-soft:#FBE3E1;

  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1614;--surface:#14201D;--surface-2:#1B2A26;--line:#2A3B36;
  --ink:#E6F0EC;--ink-2:#A9BBB5;--ink-3:#7D8F89;
  --teal:#3FBFA6;--teal-ink:#05201A;--teal-soft:#183A33;
  --marigold:#F2B24A;--marigold-soft:#3A2C12;--marigold-ink:#FBE3B5;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--teal)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}

.search{flex:1;min-width:0;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}

.tools{display:flex;gap:8px;align-items:center}

main{padding-block:22px 60px;min-height:70vh}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:stretch;margin-bottom:26px}
.hero-main{background:var(--teal);color:var(--teal-ink);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}

.hero-stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:auto}
.hero-stats b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}

.btn-primary{background:var(--marigold);color:#2A1B00}
.btn-teal{background:var(--teal);color:var(--teal-ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}

.card p{margin:0;font-size:13.5px;color:var(--ink-2)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.verified{background:var(--good-soft);color:var(--good)}
.pill.unverified{background:var(--warn-soft);color:var(--warn)}

.card-actions{display:flex;gap:8px;margin-top:auto;align-items:center}

.savebtn[aria-pressed="true"]{background:var(--marigold-soft);border-color:var(--marigold);color:var(--marigold-ink)}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:120px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 140px);overflow:auto}

.rail select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface-2);width:100%}
.count{color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums}
.more{display:flex;justify-content:center;margin-top:16px}
.detail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 14px;font-size:14px}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0;overflow-wrap:anywhere}
.disclose{font-size:12.5px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:10px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--ink-2)}
.checker{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.note{background:var(--marigold-soft);color:var(--marigold-ink);border-radius:10px;padding:10px 12px;font-size:13.5px}
.notice{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink-2)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center}
.wallet-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-3)}
.code{font-family:var(--f-mono);font-size:18px;letter-spacing:.08em;background:var(--surface-2);border-radius:9px;padding:8px 12px;user-select:all}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.admin-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:50;box-shadow:var(--shadow)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,18,.5);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:440px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px}
footer{border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{padding-block:22px;display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;font-size:13px;color:var(--ink-3)}
footer button{background:none;border:0;color:var(--ink-2);cursor:pointer;padding:0;font-size:13px}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:12px}
.prose h2{font-size:22px}
.prose h3{font-size:16px;margin-top:6px}
.prose p{margin:0}
.skeleton{color:var(--ink-3)}
@media (max-width:860px){
  .hero,.detail,.admin-grid{grid-template-columns:1fr}

@media (max-width:560px){
  .bar{flex-wrap:wrap}
  .search{order:3;flex-basis:100%}
  .kv{grid-template-columns:1fr}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function color(n){let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}

function isVerified(o){return !!ov(o).verified}
function fmtDate(s){try{return new Date(s).toLocaleDateString(S.lang==="te"?"te-IN":"en-IN",{day:"numeric",month:"short"})}catch(e){return s}}
function linkFor(o){const v=ov(o);return v.link||o.website}

function filtered(){
  const q=S.q.trim().toLowerCase();
  let r=S.offers.filter(o=>{
    if(S.fCat && catOf(o)!==S.fCat) return false;
    if(S.fType && kind(o)!==S.fType) return false;
    if(S.fVer==="v" && !isVerified(o)) return false;
    if(q){const h=(o.name+" "+o.description+" "+o.category+" "+o.notes+" "+(ov(o).headline||"")).toLowerCase(); if(!q.split(/\s+/).every(w=>h.includes(w))) return false;}
    return !ov(o).hidden;
  });
  if(S.sort==="az") r.sort((a,b)=>a.name.localeCompare(b.name));
  if(S.sort==="ver") r.sort((a,b)=>(isVerified(b)-isVerified(a))||a.name.localeCompare(b.name));
  if(S.sort==="pop") r.sort((a,b)=>(totalClicks(b.id)-totalClicks(a.id))||a.name.localeCompare(b.name));
  return r;
}

function studentMatches(){
  const c=S.checker, out=[];
  const studs=S.offers.filter(o=>kind(o)==="Student offer"&&!ov(o).hidden);
  for(const o of studs){
    const n=(o.name+" "+o.description).toLowerCase();
    let score=0, why=[];
    if((COURSE_TAGS[c.course]||[]).some(k=>n.includes(k))){score+=3;why.push("fits your course")}
    if(EVERYONE.some(k=>n.includes(k))){score+=1;why.push("open to most students")}
    const needsEmail=/github|notion|microsoft 365|figma|canva|jetbrains|azure|autodesk|unity|google workspace/.test(n);
    const needs18=/spotify|amazon prime youth|indigo|air india|spicejet|akasa/.test(n);
    if(c.level==="school" && !/railways|scholarship|khan|byju|vedantu|unacademy|physics wallah|canva/.test(n)) score-=3;
    if(needsEmail && c.email==="no"){why.push("usually needs a college email or student ID upload");score-=0.5}
    if(needs18 && c.age==="u18"){continue}
    if(/campus ambassador|student partner|student ambassadors|campus experts|developer student clubs|cloud clubs/.test(n)) {if(c.level==="school") continue; why.push("earn while you study")}
    if(score>0) out.push({o,score,why});
  }
  out.sort((a,b)=>b.score-a.score||a.o.name.localeCompare(b.o.name));
  return out;
}

    <button class="btn btn-ghost btn-small" id="refreshAdmin">Refresh</button>
  </div>
  ${S.adminTab==="verify"?`<section class="panel">
    <div class="field">Find an offer<input id="adminQ" type="search" value="${esc(S.adminQ)}" placeholder="Type a name, e.g. Hostinger"></div>
    <p class="count" style="margin:0">${q?"Matching offers":"Offers you've already edited"} — mark verified after checking the brand's site today.</p>
    <div class="tablewrap"><table><thead><tr><th>Offer</th><th>Headline shown to visitors</th><th>Your affiliate link</th><th>Status</th><th></th></tr></thead><tbody>
    ${rows.map(o=>{const v=ov(o);return `<tr data-row="${o.id}">
      <td style="min-width:150px"><b>${esc(o.name)}</b><div class="count">${esc(catOf(o))}</div></td>
      <td style="min-width:200px"><input class="ai" data-f="headline" value="${esc(v.headline||"")}" placeholder="${esc(o.description)}" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface-2)"></td>
      <td style="min-width:200px"><input class="ai" data-f="link" value="${esc(v.link||"")}" placeholder="https://…" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface-2)"></td>
      <td style="min-width:150px;font-size:13px"><label><input type="checkbox" data-f="verified" ${v.verified?"checked":""}> Verified</label><br><label><input type="checkbox" data-f="featured" ${v.featured?"checked":""}> Featured</label><br><label><input type="checkbox" data-f="hidden" ${v.hidden?"checked":""}> Hidden</label></td>
      <td><button class="btn btn-teal btn-small" data-saverow="${o.id}">Save</button></td></tr>`}).join("")||`<tr><td colspan="5" class="count">Search for an offer to verify it.</td></tr>`}
    </tbody></table></div></section>`:""}
  ${S.adminTab==="stats"?`<section class="panel"><span class="eyebrow">Most clicked offers (all visitors)</span>
    ${top.length?`<div class="tablewrap"><table><thead><tr><th>Offer</th><th>Category</th><th class="num">Clicks</th></tr></thead><tbody>${top.map(([id,n])=>{const o=S.byId.get(Number(id));return `<tr><td>${esc(o?.name||id)}</td><td>${esc(o?catOf(o):"")}</td><td class="num">${n}</td></tr>`}).join("")}</tbody></table></div>`:`<div class="empty" style="padding:18px">No clicks recorded yet. Clicks appear here as visitors tap “Get offer”.</div>`}</section>`:""}
  ${S.adminTab==="reports"?`<section class="panel"><span class="eyebrow">Problem reports from visitors</span>
    ${reps.length?`<div class="tablewrap"><table><thead><tr><th>Offer</th><th>Problem</th><th>Note</th><th>When</th></tr></thead><tbody>${reps.map(r=>{const o=S.byId.get(Number(r.offerId));return `<tr><td>${esc(o?.name||r.offerId)}</td><td>${esc(r.reason)}</td><td>${esc(r.note||"")}</td><td>${esc(fmtDate(r.at))}</td></tr>`}).join("")}</tbody></table></div>`:`<div class="empty" style="padding:18px">No reports yet. Visitors can report a broken link or wrong offer from any offer page.</div>`}</section>`:""}`;
}

function render(){
  renderTabs();
  let html="";
  if(!S.offers.length){app.innerHTML=`<p class="skeleton">Loading offers…</p>`;return}
  if(S.view==="home") html=viewHome();
  else if(S.view==="browse"||S.view==="cat") html=viewBrowse();
  else if(S.view==="offer") html=viewOffer(S.param);
  else if(S.view==="students") html=viewStudents();
  else if(S.view==="saved") html=viewSaved();
  else if(S.view==="wallet") html=viewWallet();
  else if(S.view==="admin") html=viewAdmin();
  else if(S.view==="earn") html=viewEarn();
  else if(S.view==="about") html=viewAbout();
  else html=viewHome();
  app.innerHTML=html;
  resolveNames();
}

async function resolveNames(){
  if(!S.user) return;
  const els=[...document.querySelectorAll("[data-uname]")]; if(!els.length) return;
  const ps=await S.user.profiles(els.map(e=>e.dataset.uname));
  els.forEach(e=>{e.textContent=ps[e.dataset.uname]?.name||"Friend"});
}

function go(view,param,keepScroll){
  S.view=view; S.param=param??null;
  const tok = view==="offer"?`offer-${param}`:view==="cat"?`cat-${param}`:view;
  try{ if(location.hash.slice(1)!==tok) history.replaceState(null,"","#"+tok);}catch(e){}
  render(); if(!keepScroll) window.scrollTo({top:0});
}
function fromHash(){
  const h=location.hash.slice(1);
  if(h.startsWith("ref-")){store("op_pending_ref",h.slice(4).toUpperCase());return go("wallet")}
  if(h.startsWith("offer-")) return go("offer",h.slice(6));
  if(h.startsWith("cat-")){const c=S.cats[Number(h.slice(4))];if(c){S.fCat=c.name;return go("cat",h.slice(4))}}
  if(["home","browse","students","saved","wallet","admin","earn","about"].includes(h)) return go(h);
  go("home");
}

let clickTimer=null, pendingClicks=false;
function recordClick(id){
  S.clicks[id]=(S.clicks[id]||0)+1; pendingClicks=true;
  if(!S.db||!S.uid) return;
  clearTimeout(clickTimer);
  clickTimer=setTimeout(async()=>{ if(!pendingClicks) return; pendingClicks=false;
    try{await S.db.doc("clicks/"+S.uid).set({counts:S.clicks,updatedAt:new Date().toISOString()})}catch(e){}
  },1500);
}
let saveBusy=Promise.resolve();
function toggleSave(id){
  if(!S.uid){toast(t("signIn"));return}
  S.saved.has(id)?S.saved.delete(id):S.saved.add(id);
  render_keep();
  const saved=[...S.saved];
  saveBusy=saveBusy.then(()=>S.db.doc(`data/users/${S.uid}/profile`).set({saved,lang:S.lang,updatedAt:new Date().toISOString()})).catch(()=>toast("Couldn't save — check you're signed in with access to this page."));
}
function render_keep(){const y=window.scrollY;render();window.scrollTo({top:y})}

function reportModal(id){
  if(!S.uid){toast(t("signIn"));return}
  const o=S.byId.get(Number(id));
  const bg=document.createElement("div");bg.className="modal-bg";
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="rt"><h3 id="rt" style="font-size:18px">${esc(t("report"))}: ${esc(o.name)}</h3>
    <div class="field">What's wrong?<select id="rr"><option>Link doesn't work</option><option>Offer has expired</option><option>Details are wrong</option><option>Other</option></select></div>
    <div class="field">Anything else? (optional)<textarea id="rn" rows="3" maxlength="300"></textarea></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-ghost" id="rc">Cancel</button><button class="btn btn-teal" id="rs">Send report</button></div></div>`;
  document.body.appendChild(bg);
  bg.querySelector("#rc").onclick=()=>bg.remove();
  bg.addEventListener("click",e=>{if(e.target===bg)bg.remove()});
  bg.querySelector("#rs").onclick=async()=>{
    const item={offerId:o.id,reason:bg.querySelector("#rr").value,note:bg.querySelector("#rn").value.slice(0,300),at:new Date().toISOString()};
    S.reports=[item,...S.reports].slice(0,50);
    try{await S.db.doc("reports/"+S.uid).set({items:S.reports});toast("Report sent. Thank you.")}catch(e){toast("Couldn't send the report. Try again.")}
    bg.remove();
  };
}

async function saveRow(id){
  const tr=document.querySelector(`[data-row="${id}"]`); if(!tr) return;
  const get=f=>tr.querySelector(`[data-f="${f}"]`);
  const prev=S.ov[id]||{};
  const verified=get("verified").checked;
  const doc={headline:get("headline").value.trim(),link:get("link").value.trim(),verified,featured:get("featured").checked,hidden:get("hidden").checked,
    lastChecked:verified?(prev.verified&&prev.lastChecked?prev.lastChecked:new Date().toISOString()):null,updatedAt:new Date().toISOString()};
  if(verified && get("verified").dataset.touched) doc.lastChecked=new Date().toISOString();
  if(doc.link && !/^https:\/\//.test(doc.link)){toast("Affiliate links must start with https://");return}
  try{await S.db.doc("overrides/"+id).set(doc);toast("Saved")}catch(e){toast("Couldn't save. Only the owner and editors can edit offers.")}
}

async function loadAdmin(){
  if(!S.isAdmin||!S.db) return;
  try{
    const [c,r]=await Promise.all([S.db.collection("clicks").get(),S.db.collection("reports").get()]);
    S.adminAll.clicks=c.docs.map(d=>d.data());
    S.adminAll.reports=r.docs.flatMap(d=>(d.data().items||[])).sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  }catch(e){}
  if(S.view==="admin") render_keep();
}

function randCode(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";const b=new Uint32Array(6);crypto.getRandomValues(b);for(const x of b)s+=a[x%a.length];return s}

async function initBackend(){
  if(!window.claude?.use){render();return}
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  S.db=db; S.user=user;
  if(user){ S.isAdmin=await user.canEdit(); S.uid=await user.id(); S.canWrite=await user.can("data.write"); }
  if(db){
    db.collection("overrides").onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=d.data());S.ov=o;if(!document.querySelector(".modal-bg")&&!(S.view==="admin"&&document.activeElement?.classList.contains("ai")))render_keep()},()=>{});
    if(S.uid){
      db.doc(`data/users/${S.uid}/profile`).onSnapshot(s=>{if(s.exists){const d=s.data();S.saved=new Set(d.saved||[]);if(d.lang&&d.lang!==S.lang){S.lang=d.lang}}render_keep()},()=>{});
      try{const c=await db.doc("clicks/"+S.uid).get();if(c.exists)S.clicks={...(c.data().counts||{}),...S.clicks}}catch(e){}
      try{const r=await db.doc("reports/"+S.uid).get();if(r.exists)S.reports=[...(r.data().items||[])]}catch(e){}
      try{
        const ref=db.doc("referrals/"+S.uid); const snap=await ref.get();
        if(snap.exists){S.myRef=snap.data()}
        else{
          const pending=store("op_pending_ref");
          const mine={code:randCode(),invitedBy:(pending&&/^[A-Z0-9]{6}$/.test(pending))?pending:null,joinedAt:new Date().toISOString()};
          await ref.set(mine); S.myRef=mine;
        }
        db.collection("referrals").where("invitedBy","==",S.myRef.code).onSnapshot(q=>{S.friends=q.docs.map(d=>({uid:d.id,...d.data()}));if(S.view==="wallet")render_keep()},()=>{});
      }catch(e){}
    }
    loadAdmin();
  }
  render_keep();
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-go],[data-open],[data-cat],[data-save],[data-click],[data-share],[data-report],[data-copy],[data-sharelink],[data-ck],[data-atab],[data-saverow],#more,#clear,#langbtn,#refreshAdmin");
  if(!el) return;
  if(el.dataset.go){e.preventDefault(); if(el.dataset.go==="browse"){S.fCat="";} go(el.dataset.go); if(el.dataset.go==="admin")loadAdmin(); return}
  if(el.dataset.open){go("offer",el.dataset.open);return}
  if(el.dataset.cat!==undefined){S.fCat=S.cats[Number(el.dataset.cat)].name;S.limit=48;go("cat",el.dataset.cat);return}
  if(el.dataset.save){toggleSave(Number(el.dataset.save));return}
  if(el.dataset.click){recordClick(el.dataset.click);return}
  if(el.dataset.report){reportModal(el.dataset.report);return}
  if(el.dataset.share||el.dataset.sharelink){
    const o=el.dataset.share?S.byId.get(Number(el.dataset.share)):null;
    const text=o?`${o.name}: ${ov(o).headline||o.description} — ${o.website}`:`Join me on OfferPath India and find offers you can actually use: ${el.dataset.sharelink}`;
    const a=document.createElement("a");a.href="https://wa.me/?text="+encodeURIComponent(text);a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();return}
  if(el.dataset.copy){const v=el.dataset.copy;navigator.clipboard?.writeText(v).then(()=>toast("Invite link copied"),()=>{const c=$("#mycode");if(c){const r=document.createRange();r.selectNodeContents(c);getSelection().removeAllRanges();getSelection().addRange(r)}toast("Select and copy the link below")});return}
  if(el.dataset.ck){S.checker[el.dataset.ck]=el.dataset.cv;render_keep();return}
  if(el.dataset.atab){S.adminTab=el.dataset.atab;render_keep();return}
  if(el.dataset.saverow){saveRow(el.dataset.saverow);return}
  if(el.id==="more"){S.limit+=48;render_keep();return}
  if(el.id==="clear"){S.fCat=S.fType=S.fVer="";S.q="";$("#q").value="";go("browse");return}
  if(el.id==="refreshAdmin"){loadAdmin();return}
  if(el.id==="langbtn"){S.lang=S.lang==="en"?"te":"en";store("op_lang",S.lang);render_keep();
    if(S.db&&S.uid){const saved=[...S.saved];saveBusy=saveBusy.then(()=>S.db.doc(`data/users/${S.uid}/profile`).set({saved,lang:S.lang,updatedAt:new Date().toISOString()})).catch(()=>{})}
    return}
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="fCat"){S.fCat=e.target.value;S.limit=48;render_keep()}
  if(id==="fType"){S.fType=e.target.value;S.limit=48;render_keep()}
  if(id==="fVer"){S.fVer=e.target.value;render_keep()}
  if(id==="sort"){S.sort=e.target.value;render_keep()}
  if(e.target.dataset.f==="verified") e.target.dataset.touched="1";
});
let qTimer=null;
$("#q").addEventListener("input",e=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{S.q=e.target.value;S.limit=48;if(!["browse","cat"].includes(S.view)){S.fCat="";go("browse")}else render_keep()},180)});
document.addEventListener("input",e=>{if(e.target.id==="adminQ"){clearTimeout(qTimer);const v=e.target.value;qTimer=setTimeout(()=>{S.adminQ=v;render_keep();const i=$("#adminQ");if(i){i.focus();i.setSelectionRange(v.length,v.length)}},250)}});
window.addEventListener("hashchange",fromHash);

S.lang=store("op_lang")==="te"?"te":"en";
renderTabs();
fetch("offers.json").then(r=>r.json()).then(list=>{
  S.offers=list; list.forEach(o=>S.byId.set(o.id,o));
  const m=new Map(); list.forEach(o=>{const c=catOf(o);m.set(c,(m.get(c)||0)+1)});
  S.cats=[...m].map(([name,n])=>({name,n})).sort((a,b)=>b.n-a.n);
  fromHash();
}).catch(()=>{app.innerHTML=`<div class="empty"><b>Couldn't load the offers.</b><span>Reload the page to try again.</span></div>`});
initBackend();
</script>

</body></html>
