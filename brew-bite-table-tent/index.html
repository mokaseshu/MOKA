<style>
@page{size:154mm 216mm;margin:0}
:root{--brand:#6b3e26;--accent:#d98e32;--cream:#fbf6ef;--ink:#22180f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:154mm;height:216mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:Inter,sans-serif;position:relative;background:var(--cream)}
.face{position:absolute;left:0;width:154mm;height:108mm;padding:8mm;display:grid;grid-template-columns:1fr 46mm;gap:6mm;align-items:center;background:var(--cream);overflow:hidden}
.face.top{top:0;transform:rotate(180deg)}
.face.bottom{top:108mm}
.face::before{content:"";position:absolute;left:-20mm;bottom:-28mm;width:80mm;height:80mm;border-radius:50%;background:var(--accent);opacity:.18}
.brand{position:relative}
.brand .name{font-family:"DM Serif Display",serif;font-size:24pt;color:var(--brand);line-height:1}
.brand h2{font-family:"DM Serif Display",serif;font-size:30pt;color:var(--ink);line-height:1.02;margin-top:6mm}
.brand p{font-size:10pt;color:#6e5d4d;margin-top:3mm;line-height:1.45}
.brand .tbl{display:inline-block;margin-top:5mm;background:var(--brand);color:#fff;font-weight:700;font-size:11pt;border-radius:99px;padding:1.6mm 4.5mm}
.qrbox{position:relative;background:#fff;border-radius:5mm;padding:4mm;text-align:center;box-shadow:0 1mm 4mm rgba(0,0,0,.08)}
.qrbox img,.qrbox svg{width:38mm;height:38mm;display:block;margin:0 auto}
.qrbox span{display:block;font-size:6.6pt;font-weight:700;color:var(--ink);margin-top:2mm;white-space:nowrap;letter-spacing:-.01em}
.fold{position:absolute;left:0;right:0;top:108mm;border-top:.2mm dashed #b9a58f;z-index:3}
.fold.hide{display:none}
</style>
<style>

.viewer{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.viewer-head{max-width:900px;margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between;font-family:Inter,system-ui,sans-serif}
.viewer-head b{font-size:15px}
.viewer-head span{font-size:12.5px;color:#6b6358}
.stage-outer{max-width:900px;margin:0 auto;overflow:hidden}
.stage{position:relative;transform-origin:0 0;width:154mm;height:216mm}
.stage{box-shadow:0 10px 30px rgba(60,40,20,.18)}
}

<script>
const TENT={name:"Brew & Bite",headline:"Scan for<br>our menu",sub:"Browse the full menu and order straight from your table on WhatsApp.",url:"https://mokaseshu.github.io/MOKA/brew-bite-qr-menu/",table:"",wifi:"Wi-Fi: BrewBite_Guest",showFold:true,qrSvg:document.getElementById("qr").innerHTML};
const link=TENT.url+(TENT.table?`?table=${TENT.table}`:"");
const qr=TENT.qrSvg||`<img src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&ecc=H&margin=0&data=${encodeURIComponent(link)}" alt="">`;
const short=TENT.url.replace(/^https?:\/\//,"").replace(/\/$/,"");
const face=pos=>`<div class="face ${pos}"><div class="brand"><div class="name">${TENT.name}</div><h2>${TENT.headline}</h2><p>${TENT.sub}${TENT.wifi?`<br>${TENT.wifi}`:""}</p>${TENT.table?`<span class="tbl">Table ${TENT.table}</span>`:""}</div><div class="qrbox">${qr}<span>${short}</span></div></div>`;
document.getElementById("root").innerHTML=face("top")+face("bottom")+`<div class="fold ${TENT.showFold?"":"hide"}"></div>`;
</script></div></div></div>
