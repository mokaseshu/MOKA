<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Levelora Members</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#f5f6f2;--surface:#ffffff;--ink:#14201d;--muted:#5a6863;--line:#dfe4de;
  --accent:#0d7a6a;--accent-ink:#ffffff;--xp:#f2a516;--xp-ink:#241700;--xp-soft:#fdf1d8;--tint:#e6f2ee;--danger:#b84a2f;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513;--surface:#16201d;--ink:#e9efec;--muted:#9aaba5;--line:#26332f;
  --accent:#2fb39e;--accent-ink:#06120f;--xp:#f5b53a;--xp-ink:#241700;--xp-soft:#2b2412;--tint:#132a25;--danger:#e0795e;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513;--surface:#16201d;--ink:#e9efec;--muted:#9aaba5;--line:#26332f;
  --accent:#2fb39e;--accent-ink:#06120f;--xp:#f5b53a;--xp-ink:#241700;--xp-soft:#2b2412;--tint:#132a25;--danger:#e0795e;color-scheme:dark}
*{box-sizing:border-box}
[hidden]:not([hidden=until-found i]){display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--xp);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);transition:transform .12s ease}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.xp{background:var(--xp);color:var(--xp-ink)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}

#login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:32px;display:grid;gap:18px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.03em}
.logo i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:15px}
.login-card h1{font-size:30px}
.err{color:var(--danger);font-size:13px;min-height:1em}

.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100vh;height:100dvh;border-right:1px solid var(--line);background:var(--surface);padding:22px 14px;display:flex;flex-direction:column;gap:22px}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:11px 12px;border-radius:10px;font-weight:600;text-align:left;color:var(--muted)}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{background:var(--bg);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--tint);color:var(--accent)}
.rail-xp{margin-top:auto;padding:14px;border-radius:14px;background:var(--bg);display:grid;gap:8px;font-size:13px}
.main{min-width:0;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1040px;margin:0 auto;display:grid;gap:24px}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
.page-head h1{font-size:clamp(26px,3.6vw,36px)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}

.xpbar{height:10px;border-radius:99px;background:var(--xp-soft);overflow:hidden}
.xpbar span{display:block;height:100%;background:var(--xp);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;min-width:0}

.hero-lvl{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;background:var(--ink);color:var(--bg);border-radius:20px;padding:24px}
.badge{width:76px;height:76px;border-radius:20px;background:var(--xp);color:var(--xp-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.badge small{display:block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em}
.hero-lvl .xpbar{background:rgba(255,255,255,.14);height:12px}
.hero-lvl h2{font-size:26px}
.hero-stats{display:flex;gap:22px}
.hero-stats div{display:grid;text-align:right}
.hero-stats b{font-family:var(--display);font-size:26px;color:var(--xp)}
.hero-stats span{font-size:12px;opacity:.75}

.today-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.tcard{display:grid;gap:14px;align-content:start}
.tcard-head{display:flex;justify-content:space-between;gap:10px;align-items:start}
.tcard-head h3{font-size:18px}
.cat{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tasks{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;background:var(--bg);border:1px solid transparent;width:100%;text-align:left}
.task .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:all .15s}
.task .lbl{flex:1;font-weight:600;min-width:0}
.task small{font-family:var(--mono);font-weight:700;color:var(--xp);font-size:12px}
.task.done{background:var(--tint)}
.task.done .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.task.done .lbl{color:var(--muted);text-decoration:line-through}
.task:hover{border-color:var(--line)}
.mini-prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.mini-prog .xpbar{flex:1;height:6px}
.iconbtn{border:0;background:transparent;color:var(--muted);padding:4px;border-radius:8px;line-height:0}
.iconbtn:hover{background:var(--bg);color:var(--danger)}

.empty{text-align:center;padding:44px 22px;display:grid;gap:12px;justify-items:center;border:2px dashed var(--line);border-radius:18px}
.empty h3{font-size:22px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .input{max-width:320px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:99px;font-weight:600;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cap{font-family:var(--mono);font-size:13px;font-weight:700;padding:7px 12px;border-radius:9px;background:var(--xp-soft)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;align-content:space-between;min-width:0}
.lcard h4{font-size:16px}
.lcard p{font-size:13px;color:var(--muted)}
.lcard.on{border-color:var(--accent);background:var(--tint)}
.more{justify-self:center}

.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.book{border:0;padding:0;background:transparent;text-align:left;display:grid;gap:10px}
.cover{aspect-ratio:3/4;max-width:100%;border-radius:12px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;position:relative;overflow:hidden;transition:transform .15s}
.cover small{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;opacity:.85}
.cover::after{content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;border:16px solid rgba(255,255,255,.15)}
.book:hover .cover{transform:translateY(-3px)}
.book h4{font-size:15px}
.book .meta{font-size:12px;color:var(--muted)}

.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.tool{display:grid;gap:14px;align-content:start}
.tool h3{font-size:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result{padding:14px;border-radius:12px;background:var(--bg);display:grid;gap:4px}
.result b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.timer{font-family:var(--display);font-weight:800;font-size:64px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.seg{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:11px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.board{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.brow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.brow .rk{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--muted)}
.brow.top .rk{color:var(--xp)}
.brow.me{border-color:var(--accent);background:var(--tint)}
.brow .nm{display:flex;align-items:center;gap:10px;min-width:0;font-weight:600}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.brow .pts{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
.code{display:flex;gap:8px}
.code .input{font-family:var(--mono);font-weight:700;letter-spacing:.08em}

.ladder{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.ladder li{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:10px;background:var(--bg);font-weight:600}
.ladder li.cur{background:var(--xp-soft)}
.ladder li.lock{color:var(--muted)}
.ladder small{font-family:var(--mono);font-size:12px}

.tabbar{display:none}
.lcard.create{border:2px dashed var(--line);background:transparent;place-items:center;text-align:center;align-content:center;gap:10px;min-height:170px}
.lcard.create .plus{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--accent);display:grid;place-items:center;font-size:24px;font-weight:700}
.ctag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:5px;background:var(--xp-soft);color:var(--ink);margin-left:6px;vertical-align:middle}
.lc-actions{display:flex;gap:8px}
.lc-actions .btn{flex:1}
.iconbtn.edit:hover{color:var(--accent)}
.cb-rows{display:grid;gap:8px}
textarea.input{resize:vertical;min-height:96px;line-height:1.5}
.ai-note{background:var(--xp-soft);padding:10px 14px;border-radius:10px;font-size:14px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.ai-status{font-size:14px;color:var(--muted);min-height:1.4em}
.ai-status.bad{color:var(--danger)}
.lcard.create.ai .plus{background:var(--xp-soft);color:var(--ink)}
.cb-row{display:grid;grid-template-columns:1fr 96px 36px;gap:8px;align-items:center}
.cb-row .iconbtn:disabled{opacity:.3;cursor:not-allowed}
.cb-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;pointer-events:none;transition:all .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast b{color:var(--xp)}

.modal{position:fixed;inset:0;z-index:50;background:rgba(10,18,16,.55);display:grid;place-items:center;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border-radius:20px;width:100%;max-width:640px;max-height:100%;overflow:auto;padding:28px;display:grid;gap:16px}
.sheet.sm{max-width:400px}
.reader h2{font-size:28px}
.reader h3{font-size:19px;margin-top:6px}
.reader p{max-width:62ch;color:var(--ink)}
.reader .toc{display:flex;flex-wrap:wrap;gap:6px}
.levelup{text-align:center;justify-items:center}
.levelup .badge{width:96px;height:96px;font-size:44px;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{border:0;background:transparent;display:grid;justify-items:center;gap:3px;padding:10px 2px 9px;font-size:10px;font-weight:600;color:var(--muted)}
  .tabbar svg{width:21px;height:21px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .split{grid-template-columns:1fr}
  .hero-lvl{grid-template-columns:auto 1fr}
  .hero-stats{grid-column:1/-1;justify-content:space-between}
  .hero-stats div{text-align:left}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:420px){.row2{grid-template-columns:1fr}.timer{font-size:52px}.sheet{padding:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="login">
  <form class="login-card" id="loginForm" novalidate>
    <div class="logo"><i>L</i>Levelora</div>
    <div style="display:grid;gap:6px">
      <h1>Welcome, member</h1>
      <p class="muted">Sign in with the email you paid with and the access code from your welcome message.</p>
    </div>
    <div class="field"><label for="lgName">Your name</label><input class="input" id="lgName" autocomplete="name" placeholder="Seshu"></div>
    <div class="field"><label for="lgEmail">Email</label><input class="input" id="lgEmail" type="email" autocomplete="email" placeholder="you@email.com"></div>
    <div class="field"><label for="lgCode">Access code</label><input class="input mono" id="lgCode" placeholder="LVL-XXXX-XXXX" autocomplete="one-time-code"></div>
    <p class="err" id="lgErr" role="alert"></p>
    <button class="btn" type="submit">Enter Levelora</button>
    <p class="muted" style="font-size:12px">Demo: any email works with code <span class="mono">LVL-DEMO-2999</span></p>
  </form>
</div>

<div class="shell" id="app" hidden>
  <aside class="rail">
    <div class="logo"><i>L</i>Levelora</div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-xp" id="railXp"></div>
  </aside>
  <main class="main"><div class="page" id="view"></div></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div class="toast" id="toast" role="status"></div>
<div class="modal" id="modal" hidden></div>

<script>
const ICONS={
today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>',
library:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
ebooks:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
tools:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>',
board:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
profile:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
pen:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
x:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>'
};
const TABS=[["today","Today"],["library","Library"],["ebooks","Ebooks"],["tools","Tools"],["board","Leaderboard"],["profile","Profile"]];

const CATS={

const TITLES=["Spark","Seed","Sprout","Climber","Builder","Achiever","Pathfinder","Champion","Master","Legend"];
const EXAMPLE_FRIENDS=[["Ananya R",640,"#b04a63"],["Karthik M",580,"#3d5a9e"],["Divya S",455,"#5f8f2a"],["Rahul P",390,"#c0602c"],["Sneha K",310,"#7a4fa0"],["Vikram T",220,"#2f7f9a"]];
const MAX_ACTIVE=15;
const KEY="levelora-app-v1";

const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dayShift=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");

const fresh=()=>({user:null,active:["fit-0-0","rea-0-0","mon-0-0"],done:{},xpLog:{},totalXp:0,read:{},custom:[],theme:null,invite:"LVL-"+Math.random().toString(36).slice(2,6).toUpperCase()});
let S=load();
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(fresh(),JSON.parse(r))}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const levelOf=xp=>{let l=1;while(xp>=need(l+1))l++;return l};
const need=l=>l<=1?0:50*(l-1)*l;
const titleOf=l=>TITLES[Math.min(TITLES.length-1,Math.floor((l-1)/2))];
const weekXp=()=>{let s=0,t=today();for(let i=0;i<7;i++)s+=S.xpLog[dayShift(t,-i)]||0;return s};
const streak=()=>{let n=0,t=today();if(!(S.xpLog[t]>0))t=dayShift(t,-1);while(S.xpLog[t]>0){n++;t=dayShift(t,-1)}return n};
const byId=id=>LIB.find(x=>x.id===id)||S.custom.find(x=>x.id===id);
const doneKey=(tid,i)=>today()+"|"+tid+"|"+i;

let tab="today",libCat="All",libQ="",libShown=48;

function toast(html){const t=document.getElementById("toast");t.innerHTML=html;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2200)}
function openModal(html,cls=""){const m=document.getElementById("modal");m.innerHTML='<div class="sheet '+cls+'" role="dialog" aria-modal="true">'+html+'</div>';m.hidden=false;m.querySelector("button,input")?.focus()}
function closeModal(){const m=document.getElementById("modal");m.hidden=true;m.innerHTML=""}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal"||e.target.closest("[data-close]"))closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

function gainXp(n){
  const before=levelOf(S.totalXp);
  S.totalXp=Math.max(0,S.totalXp+n);
  S.xpLog[today()]=Math.max(0,(S.xpLog[today()]||0)+n);
  save();
  const after=levelOf(S.totalXp);
  if(after>before){
    openModal('<div class="levelup" style="display:grid;gap:14px"><div class="badge">'+after+'</div><span class="eyebrow">Level up</span><h2 style="font-size:30px">You are now a '+titleOf(after)+'</h2><p class="muted">'+(need(after+1)-S.totalXp)+' XP to level '+(after+1)+'. Keep the streak alive.</p><button class="btn xp" data-close>Keep going</button></div>',"sm");
  }else if(n>0)toast('<b>+'+n+' XP</b> · nice work');
}

function renderNav(){
  const html=TABS.map(([k,l])=>'<button data-tab="'+k+'"'+(tab===k?' aria-current="page"':'')+'>'+ICONS[k]+'<span>'+l+'</span></button>').join("");
  document.getElementById("nav").innerHTML=html;
  document.getElementById("tabbar").innerHTML=html.replace(/Leaderboard/,"Ranks");
  const l=levelOf(S.totalXp),pct=Math.min(100,(S.totalXp-need(l))/(need(l+1)-need(l))*100);
  document.getElementById("railXp").innerHTML='<div style="display:flex;justify-content:space-between"><b>Lvl '+l+' · '+titleOf(l)+'</b><span class="mono muted">'+S.totalXp+'</span></div><div class="xpbar"><span style="width:'+pct+'%"></span></div><span class="muted">'+(need(l+1)-S.totalXp)+' XP to next level</span>';
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;render();window.scrollTo(0,0)}});

function render(){renderNav();({today:vToday,library:vLibrary,ebooks:vEbooks,tools:vTools,board:vBoard,profile:vProfile})[tab]()}

function vToday(){
  const l=levelOf(S.totalXp),pct=Math.min(100,(S.totalXp-need(l))/(need(l+1)-need(l))*100);
  const first=(S.user?.name||"there").split(" ")[0];
  const hr=new Date().getHours(),greet=hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
  let doneCount=0,total=0;
  const cards=S.active.map(byId).filter(Boolean).map(t=>{
    const d=t.tasks.filter((_,i)=>S.done[doneKey(t.id,i)]).length;doneCount+=d;total+=t.tasks.length;
    return '<article class="panel tcard"><div class="tcard-head"><div style="display:grid;gap:4px;min-width:0"><span class="cat" style="color:'+CAT_COL[t.cat]+'">'+t.cat+(t.custom?' · Custom':'')+'</span><h3>'+esc(t.name)+'</h3></div><div style="display:flex">'+(t.custom?'<button class="iconbtn edit" data-edit="'+t.id+'" aria-label="Edit '+esc(t.name)+'">'+ICONS.pen+'</button>':'')+'<button class="iconbtn" data-remove="'+t.id+'" aria-label="Remove '+esc(t.name)+'">'+ICONS.x+'</button></div></div><ul class="tasks">'+t.tasks.map((k,i)=>{const on=S.done[doneKey(t.id,i)];return '<li><button class="task'+(on?' done':'')+'" data-task="'+t.id+'|'+i+'" aria-pressed="'+!!on+'"><span class="box">'+(on?ICONS.check:'')+'</span><span class="lbl">'+esc(k.t)+'</span><small>+'+k.xp+'</small></button></li>'}).join("")+'</ul><div class="mini-prog"><div class="xpbar"><span style="width:'+(d/t.tasks.length*100)+'%"></span></div>'+d+'/'+t.tasks.length+'</div></article>';
  }).join("");
  document.getElementById("view").innerHTML=
  '<div class="page-head"><div style="display:grid;gap:6px"><span class="eyebrow">'+new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"})+'</span><h1>'+greet+', '+esc(first)+'</h1></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" data-create>'+ICONS.pen+' Create your own</button><button class="btn xp" data-ai>✨ Create with prompt</button><button class="btn" data-tab="library">+ Add tracker</button></div></div>'+
  '<section class="hero-lvl"><div class="badge"><div style="text-align:center"><small>LVL</small>'+l+'</div></div><div style="display:grid;gap:10px;min-width:0"><h2>'+titleOf(l)+'</h2><div class="xpbar"><span style="width:'+pct+'%"></span></div><span style="font-size:13px;opacity:.8">'+S.totalXp+' XP · '+(need(l+1)-S.totalXp)+' to level '+(l+1)+'</span></div><div class="hero-stats"><div><b>'+streak()+'</b><span>day streak</span></div><div><b>'+doneCount+'/'+total+'</b><span>done today</span></div><div><b>'+weekXp()+'</b><span>XP this week</span></div></div></section>'+
  (S.active.length?'<div class="page-head"><h2 style="font-size:22px">Today\'s quests</h2><span class="cap">'+S.active.length+'/'+MAX_ACTIVE+' active</span></div><div class="today-grid">'+cards+'</div>':
  '<div class="empty"><h3>No active trackers yet</h3><p class="muted">Pick up to 15 from the library. Each finished task earns XP.</p><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn" data-tab="library">Browse 500+ trackers</button><button class="btn ghost" data-create>Create your own</button><button class="btn xp" data-ai>✨ Create with prompt</button></div></div>');
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-task]");
  if(t){const[id,i]=t.dataset.task.split("|");const k=doneKey(id,+i);const xp=byId(id).tasks[+i].xp;
    if(S.done[k]){delete S.done[k];gainXp(-xp)}else{S.done[k]=1;gainXp(xp)}render();return}
  const r=e.target.closest("[data-remove]");
  if(r){const tr=byId(r.dataset.remove);openModal('<h3 style="font-size:22px">Remove this tracker?</h3><p class="muted">'+esc(tr.name)+' leaves your Today list. XP you already earned stays.</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" data-close>Keep it</button><button class="btn" data-confirm-remove="'+tr.id+'">Remove</button></div>',"sm");return}
  const cr=e.target.closest("[data-confirm-remove]");
  if(cr){S.active=S.active.filter(x=>x!==cr.dataset.confirmRemove);save();closeModal();render();toast("Tracker removed");return}
  const a=e.target.closest("[data-toggle]");
  if(a){const id=a.dataset.toggle;
    if(S.active.includes(id)){S.active=S.active.filter(x=>x!==id);toast("Removed from Today")}
    else if(S.active.length>=MAX_ACTIVE){toast("You have 15 active. Remove one on Today first.");return}
    else{S.active.push(id);toast("Added to Today")}
    save();render();return}
});

let draft=null;
const XP_OPTS=[5,10,15,20,30,50];
function openBuilder(id){
  const ex=id&&S.custom.find(x=>x.id===id);
  draft=ex?{id:ex.id,name:ex.name,cat:ex.cat,desc:ex.desc||"",tasks:ex.tasks.map(t=>({...t})),addNow:false}
    :{id:null,name:"",cat:"Personal",desc:"",tasks:[{t:"",xp:10},{t:"",xp:15},{t:"",xp:20}],addNow:S.active.length<MAX_ACTIVE};
  drawBuilder();

function syncDraft(){
  const m=document.getElementById("modal");if(!m.querySelector("#cbName"))return;
  draft.name=m.querySelector("#cbName").value;draft.cat=m.querySelector("#cbCat").value;draft.desc=m.querySelector("#cbDesc").value;
  draft.tasks=[...m.querySelectorAll(".cb-row")].map(r=>({t:r.querySelector("input").value,xp:+r.querySelector("select").value}));
  const a=m.querySelector("#cbAddNow");if(a)draft.addNow=a.checked;

function drawBuilder(err="",focusLast=false){
  const editing=!!draft.id,full=S.active.length>=MAX_ACTIVE;
  const note=draft.note?'<div class="ai-note"><span>✨ '+esc(draft.note)+'</span>'+(draft.prompt!=null?'<button type="button" class="btn ghost sm" id="cbReprompt">Change prompt</button>':'')+'</div>':'';

  openModal(
  '<div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><div style="display:grid;gap:6px"><span class="eyebrow">Custom tracker</span><h2 style="font-size:26px">'+(editing?'Edit your tracker':'Create your own tracker')+'</h2></div><button class="iconbtn" data-close aria-label="Close">'+ICONS.x+'</button></div>'+
  note+'<div class="field"><label for="cbName">Tracker name</label><input class="input" id="cbName" value="'+esc(draft.name)+'" maxlength="40" placeholder="e.g. Guitar Practice, Exam Prep, Shop Opening"></div>'+
  '<div class="row2"><div class="field"><label for="cbCat">Category</label><select class="input" id="cbCat">'+cats+'</select></div><div class="field"><label for="cbDesc">What is it for? (optional)</label><input class="input" id="cbDesc" value="'+esc(draft.desc)+'" maxlength="80" placeholder="Pass my exam in March"></div></div>'+
  '<div style="display:flex;justify-content:space-between;align-items:baseline"><label class="muted" style="font-size:13px;font-weight:600">Daily tasks</label><span class="mono muted" style="font-size:12px">'+draft.tasks.length+'/8</span></div>'+

  (editing?'':'<label class="check"><input type="checkbox" id="cbAddNow"'+(draft.addNow&&!full?' checked':'')+(full?' disabled':'')+'> '+(full?'Today is full (15/15). It will wait in My trackers.':'Add to Today right away')+'</label>')+
  '<p class="err" role="alert">'+esc(err)+'</p>'+

  m.querySelectorAll(".cb-row input,.cb-row select").forEach(el=>el.addEventListener("input",upd));

}

  if(e.target.closest("[data-create]")){openBuilder();return}
  const ed=e.target.closest("[data-edit]");if(ed){openBuilder(ed.dataset.edit);return}
  if(e.target.closest("#cbAdd")){syncDraft();if(draft.tasks.length<8){draft.tasks.push({t:"",xp:10});drawBuilder("",true)}return}

    save();closeModal();render();return}
  if(e.target.closest("#cbDel")){syncDraft();const n=draft.name||"this tracker";openModal('<h3 style="font-size:22px">Delete '+esc(n)+'?</h3><p class="muted">It will be removed from My trackers and Today. XP you already earned stays.</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" id="cbBack">Go back</button><button class="btn" data-cb-del-confirm style="background:var(--danger)">Delete</button></div>',"sm");return}
  if(e.target.closest("#cbBack")){drawBuilder();return}
  if(e.target.closest("[data-cb-del-confirm]")){S.custom=S.custom.filter(x=>x.id!==draft.id);S.active=S.active.filter(x=>x!==draft.id);save();closeModal();render();toast("Tracker deleted");return}
});

const STOP=new Set("i a an the to for of in on my me and with by at is am be want wanna need help please make create tracker planner daily every day days week weeks month months year a's learn".split(" "));
const NOISE=new Set("kg km minutes minute mins min hours hour hrs hr pages page glasses litres litre l by before till until lose grow prepare save get build start improve become do from into per am pm january february march april may june july august september october november december".split(" "));
const words=s=>s.toLowerCase().replace(/[^a-z0-9₹\s]/g," ").split(/\s+/).filter(w=>w&&!STOP.has(w));
const titleCase=s=>s.replace(/\b\w/g,c=>c.toUpperCase());
function localTracker(prompt){
  const ws=words(prompt),bag=ws.concat(...ws.map(w=>(SYN[w]||"").split(" "))).filter(Boolean),stems=new Set(bag.map(w=>w.slice(0,5)));
  let best=null,score=0;
  Object.entries(CATS).forEach(([cat,list])=>list.forEach(([name,...tasks])=>{
    const tw=words(name+" "+tasks.join(" ")+" "+cat);let sc=0;
    tw.forEach(w=>{if(stems.has(w.slice(0,5)))sc+=1});
    words(name).forEach(w=>{if(stems.has(w.slice(0,5)))sc+=2});
    if(sc>score){score=sc;best={cat,name,tasks}}
  }));
  const subj=ws.filter(w=>!/^[\d₹]/.test(w)&&!NOISE.has(w));
  const goal=subj.slice(0,2).join(" ")||"my goal";
  const nums=prompt.match(/(\d+)\s*(minutes?|mins?|hours?|hrs?|pages?|km|kg|days?|glasses|l\b|litres?)/i);
  const amt=nums?nums[0]:null;
  let name,cat,tasks;
  if(best&&score>=3){
    name=titleCase(subj.length?goal:best.name)+" Tracker";cat=best.cat;
    tasks=best.tasks.map((t,i)=>({t,xp:[10,15,20][i]}));
    if(amt&&/min|hour|hr/i.test(amt))tasks.unshift({t:"Practice "+goal+" for "+amt,xp:30});
    tasks.push({t:"Note today's progress",xp:5});
  }else{
    name=titleCase(goal)+" Tracker";cat="Personal";
    tasks=[{t:"Work on "+goal+(amt&&/min|hour|hr/i.test(amt)?" for "+amt:" for 30 min"),xp:30},{t:"Learn one new thing about "+goal,xp:15},{t:"Write down today's progress",xp:10},{t:"Plan tomorrow's step",xp:10}];
  }
  return{name:name.slice(0,40),cat,desc:prompt.slice(0,80),tasks:tasks.slice(0,8)};
}
function openAi(text){
  openModal(
  '<div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><div style="display:grid;gap:6px"><span class="eyebrow">✨ AI tracker builder</span><h2 style="font-size:26px">Describe what you want to track</h2></div><button class="iconbtn" data-close aria-label="Close">'+ICONS.x+'</button></div>'+
  '<p class="muted">Write your goal in one or two lines, in English or Telugu. You can edit everything before saving.</p>'+
  '<div class="field"><label for="aiPrompt">Your goal</label><textarea class="input" id="aiPrompt" maxlength="400" placeholder="e.g. I want to prepare for my group 2 exam in 90 days while working full time">'+esc(text??aiLast)+'</textarea></div>'+
  '<div style="display:grid;gap:8px"><span class="muted" style="font-size:13px;font-weight:600">Try one</span><div class="chips" style="flex-wrap:wrap">'+AI_EXAMPLES.map(x=>'<button type="button" class="chip" data-ai-ex="'+esc(x)+'">'+esc(x)+'</button>').join("")+'</div></div>'+
  '<p class="ai-status" id="aiStatus" role="status"></p>'+
  '<div class="cb-foot"><span class="muted" style="font-size:12px">Uses the built-in generator</span><div style="display:flex;gap:10px"><button type="button" class="btn ghost" data-close id="aiCancel">Cancel</button><button type="button" class="btn xp" id="aiGo">✨ Generate tracker</button></div></div>');
  const ta=document.getElementById("aiPrompt");ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))document.getElementById("aiGo").click()});
}
function toBuilder(t,prompt,note){
  draft={id:null,name:t.name,cat:t.cat,desc:t.desc,tasks:t.tasks,addNow:S.active.length<MAX_ACTIVE,note,prompt};
  drawBuilder();
}
function runAi(){
  const ta=document.getElementById("aiPrompt"),st=document.getElementById("aiStatus");
  const prompt=ta.value.trim();aiLast=prompt;
  if(prompt.length<3){st.className="ai-status bad";st.textContent="Write a few words about your goal first.";ta.focus();return}
  toBuilder(localTracker(prompt),prompt,"Made from your prompt. Review the tasks, then create it.");
}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-ai]")){openAi();return}
  const ex=e.target.closest("[data-ai-ex]");if(ex){const ta=document.getElementById("aiPrompt");ta.value=ex.dataset.aiEx;ta.focus();return}
  if(e.target.closest("#aiGo")){runAi();return}
  if(e.target.closest("#cbReprompt")){openAi(draft.prompt);return}
});

function applyTheme(){const r=document.documentElement;if(S.theme)r.setAttribute("data-theme",S.theme);else r.removeAttribute("data-theme")}

document.getElementById("loginForm").addEventListener("submit",e=>{
  e.preventDefault();
  const name=document.getElementById("lgName").value.trim(),email=document.getElementById("lgEmail").value.trim(),code=document.getElementById("lgCode").value.trim().toUpperCase();
  const err=document.getElementById("lgErr");
  if(!name){err.textContent="Enter your name.";return}
  if(!/^\S+@\S+\.\S+$/.test(email)){err.textContent="Enter a valid email address.";return}
  if(!/^LVL-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code)){err.textContent="Access code looks like LVL-XXXX-XXXX. Check your welcome message.";return}
  err.textContent="";S.user={name,email};save();boot();toast("Welcome to Levelora, <b>"+esc(name.split(" ")[0])+"</b>");
});

function boot(){applyTheme();const on=!!S.user;document.getElementById("login").hidden=on;document.getElementById("app").hidden=!on;if(on)render()}
boot();
</script>
